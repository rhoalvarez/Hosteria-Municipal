<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#3D6570">
  <title>Menú · Portal de la Luna</title>
  <link rel="stylesheet" href="../css/estilos.css">
  <!-- Aumento de precios por %: tabla de la vista previa -->
  <link rel="stylesheet" href="../css/menu-aumento.css">
  <!-- Ícono vacío: evita el error 404 de favicon.ico en la consola.
       Cuando tengamos el logo, se cambia por assets/logo.png -->
  <link rel="icon" href="data:,">
</head>
<body>
  <header class="encabezado">
    <div>
      <h1 class="encabezado__titulo">Menú</h1>
      <span id="nombre-usuario" class="encabezado__usuario"></span>
    </div>
    <div class="encabezado__acciones">
      <!-- Es un enlace (<a>) y no un botón porque lleva a otra página -->
      <a href="mesas.html" class="boton boton--secundario">Mesas</a>
      <button id="btn-salir" class="boton boton--secundario">Salir</button>
    </div>
  </header>

  <main class="contenedor">
    <!-- Pestañas: platos activos / dados de baja.
         aria-pressed dice cuál está elegida (lo leen los lectores de pantalla
         y el CSS la pinta), igual que las categorías en pedido.html -->
    <div class="menu-pestanas">
      <button type="button" id="tab-activos" class="menu-pestana" aria-pressed="true">Activos</button>
      <button type="button" id="tab-bajas" class="menu-pestana" aria-pressed="false">Dados de baja</button>
    </div>

    <!-- Buscador + botón de alta -->
    <div class="menu-herramientas">
      <div class="pedido-buscador">
        <label for="buscador">Buscar por código o nombre</label>
        <input id="buscador" type="search" autocomplete="off" placeholder="Ej.: A01 o milanesa">
      </div>
      <button type="button" id="btn-nuevo" class="boton boton--exito">+ Nuevo plato</button>
      <!-- Cada 6 meses aprox. suben los precios: todos juntos, por % -->
      <button type="button" id="btn-aumento" class="boton boton--secundario">Aumentar precios (%)</button>
    </div>

    <!-- Aviso de lo que pasó ("Plato guardado ✔", "Revisá el precio").
         El botón "Editar" solo aparece después de reactivar un plato -->
    <div id="aviso" class="alerta alerta--info menu-aviso" role="status" hidden>
      <span id="aviso-texto"></span>
      <button type="button" id="aviso-editar" class="boton boton--primario" hidden>Editar precio</button>
    </div>

    <!-- "Cargando...", errores de conexión, "No hay platos" -->
    <p id="mensaje" class="mensaje" role="status">Cargando menú...</p>

    <!-- Acá menu.js dibuja los platos agrupados por categoría -->
    <div id="lista-platos"></div>
  </main>

  <!-- Panel con el formulario: el MISMO para alta y edición -->
  <div id="panel-fondo" class="panel-fondo" hidden>
    <section class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-titulo">
      <h2 id="panel-titulo" class="panel__titulo">Nuevo plato</h2>

      <!-- novalidate: validamos con JS para mostrar nuestros mensajes en español,
           los mismos que devuelve el servidor -->
      <form id="form-plato" novalidate>
        <div class="campo">
          <label for="input-categoria">Categoría</label>
          <select id="input-categoria" aria-describedby="error-categoria"></select>
          <p id="error-categoria" class="mensaje mensaje--error" hidden></p>
        </div>

        <div class="campo">
          <label for="input-codigo">Código</label>
          <!-- autocapitalize: el celular escribe en mayúsculas solo -->
          <input id="input-codigo" type="text" maxlength="4" autocomplete="off"
                 autocapitalize="characters" spellcheck="false" placeholder="Ej.: A05"
                 aria-describedby="error-codigo">
          <p id="error-codigo" class="mensaje mensaje--error" hidden></p>
        </div>

        <div class="campo">
          <label for="input-nombre">Nombre</label>
          <input id="input-nombre" type="text" maxlength="60" autocomplete="off"
                 aria-describedby="error-nombre">
          <p id="error-nombre" class="mensaje mensaje--error" hidden></p>
        </div>

        <div class="campo">
          <label for="input-precio">Precio ($, sin centavos)</label>
          <!-- inputmode numeric: en el celular abre el teclado de números -->
          <input id="input-precio" type="number" inputmode="numeric" min="1" step="1"
                 aria-describedby="error-precio">
          <p id="error-precio" class="mensaje mensaje--error" hidden></p>
        </div>

        <!-- Error general (sin wifi, error del servidor) -->
        <p id="error-form" class="mensaje mensaje--error" role="alert" hidden></p>

        <div class="panel__acciones">
          <button type="button" class="boton boton--secundario" data-cerrar>Cancelar</button>
          <button type="submit" id="btn-guardar" class="boton boton--primario">Guardar</button>
        </div>
      </form>
    </section>
  </div>

  <!-- Panel del AUMENTO DE PRECIOS POR %.
       1. Porcentaje, categoría y redondeo → "Ver cómo quedan"
       2. Tabla con precio actual y nuevo (lo calcula el servidor)
       3. "Aplicar aumento" con confirmación en dos toques -->
  <div id="panel-aumento" class="panel-fondo" hidden>
    <section class="panel panel-aumento" role="dialog" aria-modal="true" aria-labelledby="titulo-aumento">
      <h2 id="titulo-aumento" class="panel__titulo">Aumentar precios</h2>

      <form id="form-aumento" novalidate>
        <div class="campo">
          <label for="aumento-porcentaje">Porcentaje de aumento</label>
          <input id="aumento-porcentaje" type="number" inputmode="decimal" min="0.01" max="100" step="0.01"
                 placeholder="Ej.: 15">
        </div>

        <div class="campo">
          <label for="aumento-categoria">¿A qué platos?</label>
          <!-- menu.js agrega una opción por categoría -->
          <select id="aumento-categoria">
            <option value="">Todos los platos activos</option>
          </select>
        </div>

        <div class="campo">
          <label for="aumento-redondeo">Redondear hacia arriba a</label>
          <select id="aumento-redondeo">
            <option value="100" selected>$ 100 (ej.: 10.925 → 11.000)</option>
            <option value="50">$ 50</option>
            <option value="10">$ 10</option>
            <option value="1">Sin redondear</option>
          </select>
        </div>

        <p id="error-aumento" class="mensaje mensaje--error" role="alert" hidden></p>

        <button type="submit" id="btn-vista-aumento" class="boton boton--primario boton--bloque">Ver cómo quedan</button>
      </form>

      <!-- Vista previa (se oculta si cambian los datos de arriba) -->
      <div id="vista-aumento" hidden>
        <p id="resumen-aumento" class="aumento-resumen"></p>
        <div class="aumento-tabla-contenedor" tabindex="0" aria-label="Precios actuales y nuevos">
          <table class="aumento-tabla">
            <thead>
              <tr>
                <th scope="col">Código</th>
                <th scope="col">Plato</th>
                <th scope="col" class="aumento-num">Actual</th>
                <th scope="col" class="aumento-num">Nuevo</th>
              </tr>
            </thead>
            <tbody id="tabla-aumento"></tbody>
          </table>
        </div>
        <p class="aumento-nota">Los pedidos ya hechos mantienen su precio. Los platos dados de baja no cambian.</p>
      </div>

      <div class="panel__acciones">
        <button type="button" id="btn-cancelar-aumento" class="boton boton--secundario">Cancelar</button>
        <button type="button" id="btn-aplicar-aumento" class="boton boton--peligro" hidden>Aplicar aumento</button>
      </div>
    </section>
  </div>

  <!-- El orden importa: api.js usa sesion.js; menu.js usa los tres -->
  <script src="../js/sesion.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/formato.js"></script>
  <script src="../js/menu.js"></script>
</body>
</html>
