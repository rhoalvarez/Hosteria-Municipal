openapi: 3.0.3
info:
  title: API Hostería Municipal
  version: 1.0.0
  description: API REST para comandas, caja y hospedaje. Las operaciones de persistencia llaman procedimientos almacenados MariaDB.
servers:
  - url: http://localhost:3000/api
    description: Entorno local
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    Login:
      type: object
      required: [usuario, clave]
      properties:
        usuario: { type: string, example: admin }
        clave: { type: string, format: password }
    Pedido:
      type: object
      required: [uid, items]
      properties:
        uid: { type: string, example: WEB-00001 }
        origen: { type: string, example: SALON }
        items:
          type: array
          items:
            type: object
            required: [id_item, cantidad]
            properties:
              id_item: { type: integer }
              cantidad: { type: integer, minimum: 1 }
              observaciones: { type: string }
security: []
paths:
  /health:
    get:
      summary: Estado del servicio
      responses:
        '200': { description: Servicio disponible }
  /auth/setup/admin:
    post:
      summary: Crear primer administrador (solo si no hay usuarios)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, usuario, clave]
              properties:
                nombre: { type: string }
                usuario: { type: string }
                clave: { type: string, minLength: 10 }
      responses:
        '201': { description: Administrador creado }
        '403': { description: La configuración inicial ya fue realizada }
  /auth/login:
    post:
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Login' }
      responses:
        '200': { description: Token JWT }
        '401': { description: Credenciales incorrectas }
  /categorias:
    get:
      summary: Listar categorías
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Categorías } }
    post:
      summary: Crear categoría
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [letra, nombre]
              properties:
                letra: { type: string, maxLength: 5 }
                nombre: { type: string, maxLength: 50 }
      responses: { '201': { description: Categoría creada } }
  /menu:
    get:
      summary: Listar menú
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: todos
          schema: { type: boolean }
          description: true incluye artículos inactivos
      responses: { '200': { description: Artículos del menú } }
    post:
      summary: Crear artículo de menú
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo, id_categoria, nombre, precio]
              properties:
                codigo: { type: string }
                id_categoria: { type: integer }
                nombre: { type: string }
                descripcion: { type: string }
                precio: { type: number, minimum: 0 }
      responses: { '201': { description: Artículo creado } }
  /mesas:
    get:
      summary: Listar mesas y disponibilidad
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Mesas } }
    post:
      summary: Crear mesa
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [numero, capacidad]
              properties:
                numero: { type: integer }
                capacidad: { type: integer }
                codigo_qr: { type: string }
      responses: { '201': { description: Mesa creada } }
  /comandas:
    post:
      summary: Abrir comanda para una mesa
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [numero, id_mesa, personas]
              properties:
                numero: { type: integer }
                id_mesa: { type: integer }
                personas: { type: integer }
      responses: { '201': { description: Comanda abierta }, '400': { description: Mesa ya ocupada o datos inválidos } }
  /comandas/abiertas:
    get:
      summary: Listar comandas abiertas
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Comandas abiertas } }
  /comandas/{id}/pedidos:
    post:
      summary: Registrar pedido e ítems en una transacción
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Pedido' }
      responses: { '201': { description: Pedido registrado }, '400': { description: Validación o regla de negocio } }
  /pedidos/{id}:
    get:
      summary: Consultar detalle de pedido
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      responses: { '200': { description: Detalle }, '404': { description: No encontrado } }
  /pedidos/{id}/estado:
    patch:
      summary: Cambiar estado de pedido
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [estado]
              properties:
                estado: { type: string, enum: [ENVIADO, LISTO, CANCELADO] }
      responses: { '200': { description: Estado actualizado } }
  /caja/turnos/apertura:
    post:
      summary: Abrir turno de caja
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                saldo_inicial: { type: number, minimum: 0 }
      responses: { '201': { description: Turno abierto } }
  /caja/turnos/{id}/cierre:
    post:
      summary: Cerrar turno de caja
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [efectivo_contado]
              properties:
                efectivo_contado: { type: number, minimum: 0 }
                observaciones: { type: string }
      responses: { '200': { description: Caja cerrada } }
  /caja/comandas/{id}/cobros:
    post:
      summary: Cobrar comanda y registrar movimiento de caja
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: id, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_turno_caja, total]
              properties:
                id_turno_caja: { type: integer }
                total: { type: number }
                forma: { type: string, example: EFECTIVO }
                importe: { type: number }
                sin_cargo: { type: boolean }
                id_autoriza: { type: integer, nullable: true }
                motivo_sin_cargo: { type: string }
      responses: { '201': { description: Cobro registrado } }
  /huespedes:
    get:
      summary: Listar huéspedes
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Huéspedes } }
    post:
      summary: Registrar huésped
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nombre, apellido, dni]
              properties:
                nombre: { type: string }
                apellido: { type: string }
                dni: { type: string }
      responses: { '201': { description: Huésped creado } }
  /estadias:
    get:
      summary: Listar estadías
      security: [{ bearerAuth: [] }]
      responses: { '200': { description: Estadías } }
    post:
      summary: Registrar estadía
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_huesped, nro_habitacion, ingreso]
              properties:
                id_huesped: { type: integer }
                nro_habitacion: { type: string }
                ingreso: { type: string, format: date-time }
                egreso: { type: string, format: date-time, nullable: true }
      responses: { '201': { description: Estadía creada } }
